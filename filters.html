<script>
document.addEventListener('DOMContentLoaded', () => {
  const search = document.getElementById('measure-search');
  const table = document.getElementById('measure-table');
  const count = document.getElementById('measure-count');
  if (!search || !table || !count) return;
  const rows = Array.from(table.querySelectorAll('tbody tr'));
  function filter() {
    const query = search.value.trim().toLocaleLowerCase();
    let shown = 0;
    rows.forEach(row => {
      const match = row.textContent.toLocaleLowerCase().includes(query);
      row.hidden = !match;
      if (match) shown++;
    });
    count.textContent = `${shown} of ${rows.length} measures`;
  }
  search.addEventListener('input', filter);
  filter();
});
</script>
