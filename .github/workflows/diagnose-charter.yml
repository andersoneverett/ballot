name: Diagnose Charter citations
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out publication
        uses: actions/checkout@v6
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - name: Install xml2
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::xml2
          dependencies: '"hard"'
          cache: 'true'
          install-pandoc: 'false'
          install-quarto: 'false'
      - name: Report Charter citation targets
        run: Rscript scripts/diagnose_charter_citations.R
