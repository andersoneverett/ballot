name: Build and publish Baltimore Ballot
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out publication
        uses: actions/checkout@v6
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - name: Install and cache R rendering packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::knitr
            any::rmarkdown
            any::xml2
          dependencies: '"hard"'
          cache: 'true'
          install-pandoc: 'false'
          install-quarto: 'false'
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
      - name: Check links (warnings only)
        run: Rscript scripts/check.R --links
      - name: Build charter pages
        run: Rscript scripts/build_charter.R
      - name: Render publication
        run: |
          Rscript -e 'unlink("docs", recursive = TRUE)'
          quarto render
      - name: Upload rendered preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: baltimore-ballot-preview
          path: docs/
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: docs/
          include-hidden-files: true
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6.0.0
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
