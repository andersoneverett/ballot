name: Build and publish Baltimore Ballot
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out publication
        uses: actions/checkout@v6
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - name: Install system dependency for R packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libuv1-dev libxml2-dev
      - name: Install R rendering packages
        run: Rscript -e 'packages <- c("knitr", "rmarkdown", "xml2"); install.packages(packages, repos = "https://cloud.r-project.org", Ncpus = 2); stopifnot(all(vapply(packages, requireNamespace, logical(1), quietly = TRUE)))'
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
      - name: Test publication behavior
        run: Rscript scripts/test-publication.R
      - name: Test measure tags
        run: Rscript scripts/test-tags.R
      - name: Render and validate publication
        run: quarto render
      - name: Check rendered site
        run: Rscript scripts/check-render.R
      - name: Check every legacy redirect destination
        run: Rscript scripts/check-redirects.R
      - name: Upload rendered preview
        uses: actions/upload-artifact@v7.0.2
        with:
          name: baltimore-ballot-preview
          path: docs/
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: docs/
          include-hidden-files: true
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6.0.0
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
