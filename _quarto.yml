project:
  type: website
  output-dir: docs
  execute-dir: project
  pre-render:
    - Rscript scripts/check.R
  render:
    - index.qmd
    - about.qmd
    - privacy.qmd
    - elections/index.qmd
    - elections/*/*/index.qmd
website:
  title: "Baltimore Ballot"
  site-url: "https://andersoneverett.github.io/ballot/"
  description: "Plain-language guides to Baltimore City ballot questions, with sourced election results."
  navbar:
    background: "#20272B"
    foreground: "#FFFFFF"
    title: "Baltimore Ballot"
    left:
      - href: elections/index.qmd
        text: Ballot Guides
      - href: about.qmd
        text: About
  search: false
  page-footer:
    left: "© `<script>document.write(new Date().getFullYear())</script>`{=html} Baltimore Ballot"
    right:
      - text: Privacy Policy
        href: privacy.qmd
format:
  html:
    theme: cosmo
    css: styles.css
    toc: false
    lang: en
    link-external-newwindow: true
execute:
  echo: false
  warning: false
  message: false
  freeze: false
