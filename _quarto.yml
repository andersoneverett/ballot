project:
  type: website
  output-dir: docs
  execute-dir: project
  resources:
    - .nojekyll
  pre-render:
    - Rscript scripts/check.R
  render:
    - index.qmd
    - about.qmd
    - elections/index.qmd
    - elections/*/*/index.qmd
    - articles/*/index.qmd
website:
  title: "Baltimore Ballot"
  site-url: "https://andersoneverett.github.io/ballot/"
  description: "Clear explanations of Baltimore ballot questions, sourced election results with clearly labeled status, and reporting on what follows."
  navbar:
    background: "#20272B"
    foreground: "#FFFFFF"
    title: "Baltimore Ballot"
    left:
      - href: elections/index.qmd
        text: Ballot Guides
      - href: about.qmd
        text: About
  search: false
  page-footer:
    left: "Baltimore Ballot · Independent coverage of Baltimore City ballot decisions."
    right:
      - text: Home
        href: index.qmd
      - text: Ballot Guides
        href: elections/index.qmd
      - text: About
        href: about.qmd
format:
  html:
    theme: cosmo
    css:
      - styles.css
      - tags.css
    toc: false
    lang: en
    link-external-newwindow: true
execute:
  echo: false
  warning: false
  message: false
  freeze: false
