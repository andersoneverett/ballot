project:
  type: website
  output-dir: docs
  execute-dir: project
  pre-render:
    - Rscript scripts/check.R
  render:
    - index.qmd
    - about.qmd
    - privacy.qmd
    - elections/index.qmd
    - elections/*/*/index.qmd
    - charter/*.qmd
website:
  title: "Baltimore Ballot"
  site-url: "https://andersoneverett.github.io/ballot/"
  description: "Plain-language guides to Baltimore City ballot questions, with sourced election results."
  navbar:
    background: "#20272B"
    foreground: "#FFFFFF"
    title: "Baltimore Ballot"
    left:
      - href: elections/index.qmd
        text: Ballot Guides
      - href: charter/index.qmd
        text: Charter
      - href: about.qmd
        text: About
  search:
    location: sidebar
    type: textbox
  sidebar:
    - id: charter
      title: "Baltimore City Charter"
      style: docked
      search: true
      collapse-level: 1
      contents:
        - text: "Charter Home"
          href: charter/index.qmd
        - charter/article-i.qmd
        - charter/article-ii.qmd
        - charter/article-iii.qmd
        - charter/article-iv.qmd
        - charter/article-v.qmd
        - charter/article-vi.qmd
        - charter/article-vii.qmd
        - charter/article-viii.qmd
        - charter/article-ix.qmd
        - charter/article-x.qmd
        - charter/article-xi.qmd
  page-footer:
    left: "© `<script>document.write(new Date().getFullYear())</script>`{=html} Baltimore Ballot"
    right:
      - text: Privacy Policy
        href: privacy.qmd
format:
  html:
    theme: cosmo
    css:
      - styles.css
      - charter.css
    toc: false
    lang: en
    link-external-newwindow: true
execute:
  echo: false
  warning: false
  message: false
  freeze: false
