project:
  type: website
  output-dir: docs
  execute-dir: project
  pre-render:
    - Rscript scripts/check.R
  render:
    - index.qmd
    - about.qmd
    - privacy.qmd
    - elections/index.qmd
    - elections/*/*/index.qmd
    - elections/*/*/question-*/index.qmd
    - charter/*.qmd
website:
  title: "Baltimore Ballot"
  site-url: "https://andersoneverett.github.io/ballot/"
  description: "Plain-language guides to Baltimore City ballot questions, with sourced election results."
  navbar:
    background: "#20272B"
    foreground: "#FFFFFF"
    title: "Baltimore Ballot"
    search: true
    left:
      - href: elections/index.qmd
        text: Ballot Guides
      - href: charter/index.qmd
        text: Charter
      - href: about.qmd
        text: About
  search:
    location: navbar
    type: overlay
  sidebar:
    - id: charter
      title: "Baltimore City Charter"
      style: docked
      contents:
        - text: "Charter Home"
          href: charter/index.qmd
        - charter/article-01.qmd
        - charter/article-02.qmd
        - charter/article-03.qmd
        - charter/article-04.qmd
        - charter/article-05.qmd
        - charter/article-06.qmd
        - charter/article-07.qmd
        - charter/article-08.qmd
        - charter/article-09.qmd
        - charter/article-10.qmd
        - charter/article-11.qmd
  page-footer:
    left: "© `<script>document.write(new Date().getFullYear())</script>`{=html} Baltimore Ballot"
    right:
      - text: Privacy Policy
        href: privacy.qmd
format:
  html:
    theme: cosmo
    css: styles.css
    toc: false
    lang: en
    link-external-newwindow: true
execute:
  echo: false
  warning: false
  message: false
  freeze: false
